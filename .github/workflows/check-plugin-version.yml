name: Check plugin version

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  plugin-version:
    name: Plugin version policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tested merge candidate
        run: git rev-parse --verify 'HEAD^2'
      - name: Check plugin release version
        run: python3 scripts/check_plugin_version.py --base 'HEAD^1' --head HEAD
      - name: Test plugin version policy
        run: python3 -m unittest scripts.test_check_plugin_version
